name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, lint, types, test, build, boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The data-layer suites run against a real MySQL 9.7 (ADR 0001): migrations, the tenant-rules
      # check, database privileges and the cross-tenant harness. Passwords are random per run.
      - run: npm run db:up
      - run: npm run test
      - run: npm run build
      # Proves the module-boundary rule fires on a deliberate violation (ARC-030, ARC-056).
      - run: npm run check:boundaries
      - run: npm run check:tags
      # Proves the raw-SQL lint rule fires on deliberate violations (ARC-020).
      - run: npm run check:raw-sql
      # Proves only libs/core/redis-store may import a Redis-compatible client (ARC-055, ADR 0003).
      - run: npm run check:redis-import

  oss-only:
    name: OSS-only build and test (no ee code present)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:oss-only
      - run: npm run build
      # The data-layer suites run against a real MySQL 9.7 (ADR 0001): migrations, the tenant-rules
      # check, database privileges and the cross-tenant harness. Passwords are random per run.
      - run: npm run db:up
      - run: npm run test

  dependency-scan:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high
